name: Smartsheet JSON Sync

on:
  schedule:
    - cron: "3-59/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartsheet-python-sdk

      - name: Export Smartsheet Data
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
        run: python get_SmS.py

      - name: Debug - Verify JSON File
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -lh smartsheet_data.json
          python -m json.tool smartsheet_data.json > /dev/null
          echo "JSON file is valid."

      - name: Commit JSON Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f smartsheet_data.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Smartsheet JSON"
            git push origin HEAD:main
            echo "JSON updated successfully."
          else
            echo "No changes detected."
          fi

